plugins { id 'com.android.application' }

android {
    namespace 'com.paldoyadam.game'
    compileSdk 34
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'com.paldoyadam.game'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '0.7.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DPALDO_BUILD_GAME=ON', '-DPALDO_BUILD_TESTS=OFF', '-DANDROID_STL=none'
                targets 'main', 'SDL2'
            }
        }
    }
    sourceSets {
        main {
            java.srcDirs += '../../third_party/SDL/android-project/app/src/main/java'
            assets.srcDirs = ['../../assets']
        }
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes { release { minifyEnabled false } }
    // Align native libraries for devices that use 16 KiB memory pages.
    packagingOptions { jniLibs { useLegacyPackaging true } }
}
